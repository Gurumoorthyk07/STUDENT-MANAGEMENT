<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile | IT Department</title>
  <script>
    (function () {
      const stored = localStorage.getItem('sms-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = stored || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/form-profile.css">
</head>
<body class="dashboard-body profile-page portal-it">

  <div class="app-shell">
    <aside class="sidebar animate-in slide-in-from-left duration-500" id="sidebar">
      <div class="sidebar-glow" aria-hidden="true"></div>
      <div class="sidebar-top">
        <a href="../index.html" class="sidebar-brand">
          <span class="brand-mark glow-accent">IT</span>
          <span class="brand-text">
            <span class="brand-name">Student Mgmt</span>
            <span class="brand-portal">IT Department</span>
          </span>
        </a>
        <nav class="sidebar-nav" aria-label="IT navigation">
          <a class="nav-link" href="index.html" data-nav>
            <span class="nav-indicator" aria-hidden="true"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <path d="M8 21h8M12 17v4"/>
            </svg>
            IT Students
          </a>
          <a class="nav-link active" href="#" data-nav>
            <span class="nav-indicator" aria-hidden="true"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20a8 8 0 0 1 16 0"/>
            </svg>
            Student Profile
          </a>
          <a class="nav-link" href="../index.html" data-nav>
            <span class="nav-indicator" aria-hidden="true"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M3 10.5 12 3l9 7.5"/>
              <path d="M5 10v10h14V10"/>
            </svg>
            Main Portal
          </a>
        </nav>
      </div>
      <div class="sidebar-footer">
        <div class="sidebar-hint">View-only IT student profile</div>
      </div>
    </aside>

    <div class="main-column">
      <header class="top-navbar animate-in fade-in slide-in-from-top duration-500">
        <div class="navbar-left">
          <button type="button" class="icon-btn sidebar-toggle hover-lift" id="sidebarToggle" aria-label="Toggle sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
          </button>
          <div class="navbar-titles">
            <h1 class="page-title">Student Profile</h1>
            <p class="page-subtitle">IT department student details</p>
          </div>
        </div>
        <div class="navbar-right">
          <span class="portal-pill">IT Portal</span>
          <button type="button" class="theme-toggle hover-lift" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"/>
            </svg>
          </button>
        </div>
      </header>

      <main class="dashboard-main">
        <div class="profile-shell">
          <div class="profile-toolbar">
            <a href="index.html" class="btn btn-outline btn-sm hover-scale">&larr; Back to List</a>
          </div>
          <div class="profile-hero profile-header">
            <img id="viewPhoto" class="profile-photo" hidden alt="">
            <div id="viewInitials" class="profile-photo"></div>
            <div>
              <h2 class="profile-name" id="viewName">--</h2>
              <div class="profile-meta" id="viewMeta">--</div>
            </div>
          </div>
          <div class="profile-block">
            <div class="section-title">Basic Info</div>
            <div class="info-grid" id="basicInfoGrid"></div>
          </div>
          <div class="profile-block">
            <div class="section-title">Parent Details</div>
            <div class="info-grid" id="parentInfoGrid"></div>
          </div>
          <div class="profile-block">
            <div class="section-title">School Details</div>
            <div class="info-grid" id="schoolInfoGrid"></div>
          </div>
          <div class="profile-block">
            <div class="section-title">College Details</div>
            <div class="info-grid" id="collegeInfoGrid"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

<script src="../js/common.js"></script>
<script src="../js/theme-toggle.js"></script>
<script src="../js/profile-view.js"></script>
</body>
</html>
